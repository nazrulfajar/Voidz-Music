name: my_music_player
description: Voidz Music - personal music player
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Audio
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.13
  audio_session: ^0.1.19

  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Networking
  dio: ^5.4.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.0.0
  youtube_explode_dart: ^3.1.0

  # Navigation
  go_router: ^14.2.0

  # UI
  cached_network_image: ^3.3.0
  palette_generator: ^0.3.3+7
  shimmer: ^3.0.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.0
  lottie: ^3.1.0

  # Utility
  path_provider: ^2.1.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  permission_handler: ^11.3.0
  marquee: ^2.3.0
  logger: ^2.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
