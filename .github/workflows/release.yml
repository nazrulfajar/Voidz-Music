name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: my_music_player
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Configure release signing
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my_music_player/android/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > my_music_player/android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-assets/VoidzMusic-${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-assets/VoidzMusic-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-assets/VoidzMusic-${VERSION}-x86_64.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Verify APK signer
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voidz Music ${{ github.ref_name }}
          files: |
            my_music_player/release-assets/VoidzMusic-*-arm64-v8a.apk
            my_music_player/release-assets/VoidzMusic-*-armeabi-v7a.apk
            my_music_player/release-assets/VoidzMusic-*-x86_64.apk
            my_music_player/release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
